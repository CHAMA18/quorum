name = "quorum-edge"
main = "src/index.ts"
compatibility_date = "2026-10-28"
workers_dev = true
# No `routes`: quorum-solutions.com is not a zone on this Cloudflare account,
# so a zone route here failed every deploy *after* the worker had uploaded
# ("zone does not exist"), which made a successful release look like a failure.
# The worker is served from workers.dev; the public landing and the admin
# portal are separate origins (ADMIN_PORTAL_URL).

[vars]
ORIGIN_URL = "https://quorum-api-tgw2.onrender.com"
ADMIN_PORTAL_URL = "https://d1n7mv5t5hn4xe.cloudfront.net"

[[r2_buckets]]
binding = "TENDERS"
bucket_name = "quorum-tenders"

[ai]
binding = "AI"

[observability]
enabled = true
