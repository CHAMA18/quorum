<!doctype html>
<html
  lang="en"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Ground","default":"#08090c"},
    {"id":"color-accent","type":"color","label":"Audit red","default":"#e8382a"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1600, height=900" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ground: #08090c;
        --accent: #e8382a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1600px;
        height: 900px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ground);
      }
      .scene-host {
        position: absolute;
        inset: 0;
      }
      #wipe {
        position: absolute;
        top: -2%;
        bottom: -2%;
        left: 0;
        right: auto;
        width: 2px;
        height: auto;
        z-index: 20;
        pointer-events: none;
        background: var(--accent);
        box-shadow:
          0 0 22px rgba(232, 56, 42, 0.85),
          0 0 90px rgba(232, 56, 42, 0.4);
      }
      .flash {
        position: absolute;
        inset: 0;
        z-index: 21;
        pointer-events: none;
        opacity: 0;
      }
      #fade-in {
        position: absolute;
        inset: 0;
        z-index: 30;
        pointer-events: none;
        background: var(--ground);
        opacity: 1;
      }
      #flash-port,
      #flash-stamp {
        background: #e8382a;
      }
      #flash-white {
        background: #f3e3cf;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="14"
      data-width="1600"
      data-height="900"
      data-motion-blur="on"
    >
      <div
        id="city-host"
        class="scene-host clip"
        data-composition-id="city"
        data-composition-src="compositions/city.html"
        data-start="0"
        data-duration="3.5"
        data-track-index="1"
        data-width="1600"
        data-height="900"
        data-track-kind="graphics"
      ></div>
      <div
        id="port-host"
        class="scene-host clip"
        data-composition-id="port"
        data-composition-src="compositions/port.html"
        data-start="3.15"
        data-duration="2.75"
        data-track-index="2"
        data-width="1600"
        data-height="900"
        data-track-kind="graphics"
      ></div>
      <div
        id="warehouse-host"
        class="scene-host clip"
        data-composition-id="warehouse"
        data-composition-src="compositions/warehouse.html"
        data-start="5.8"
        data-duration="2.35"
        data-track-index="3"
        data-width="1600"
        data-height="900"
        data-track-kind="graphics"
      ></div>
      <div
        id="clinic-host"
        class="scene-host clip"
        data-composition-id="clinic"
        data-composition-src="compositions/clinic.html"
        data-start="8"
        data-duration="3"
        data-track-index="4"
        data-width="1600"
        data-height="900"
        data-track-kind="graphics"
      ></div>
      <div
        id="server-host"
        class="scene-host clip"
        data-composition-id="server"
        data-composition-src="compositions/server.html"
        data-start="10.8"
        data-duration="2.5"
        data-track-index="5"
        data-width="1600"
        data-height="900"
        data-track-kind="graphics"
      ></div>
      <div
        id="seal-host"
        class="scene-host clip"
        data-composition-id="seal"
        data-composition-src="compositions/seal.html"
        data-start="13.2"
        data-duration="0.8"
        data-track-index="6"
        data-width="1600"
        data-height="900"
        data-track-kind="graphics"
      ></div>

      <div id="wipe" class="clip" data-start="3.15" data-duration="0.35" data-track-index="20"></div>
      <div id="flash-port" class="flash clip" data-start="5.85" data-duration="0.14" data-track-index="21"></div>
      <div id="flash-white" class="flash clip" data-start="7.98" data-duration="0.12" data-track-index="22"></div>
      <div id="flash-stamp" class="flash clip" data-start="10.78" data-duration="0.16" data-track-index="23"></div>

      <!-- The loop opens out of the ground and closes back into it: at the
           seam both sides are the same black, so the hero never blinks. -->
      <div id="fade-in"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      /* A held black lifts into the first shot — the seam of the loop. */
      tl.fromTo("#fade-in", { opacity: 1 }, { opacity: 0, duration: 0.9, ease: "power2.out" }, 0);

      /* The file is read: a red scan crosses the city and opens the port. */
      tl.fromTo("#wipe", { x: 1600, opacity: 1 }, { x: 0, duration: 0.35, ease: "power2.inOut" }, 3.15);

      /* The supply chain is a sequence of records, not a montage. */
      tl.fromTo("#flash-port", { opacity: 0 }, { opacity: 0.2, duration: 0.04, ease: "power1.out" }, 5.85);
      tl.to("#flash-port", { opacity: 0, duration: 0.1, ease: "power1.in" }, 5.89);

      /* A shutter between the warehouse and the clinic. */
      tl.fromTo("#flash-white", { opacity: 0 }, { opacity: 0.18, duration: 0.035, ease: "power1.out" }, 7.98);
      tl.to("#flash-white", { opacity: 0, duration: 0.085, ease: "power1.in" }, 8.015);

      /* The stamp lands, the record writes. */
      tl.fromTo("#flash-stamp", { opacity: 0 }, { opacity: 0.26, duration: 0.035, ease: "power1.out" }, 10.78);
      tl.to("#flash-stamp", { opacity: 0, duration: 0.12, ease: "power1.in" }, 10.815);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
