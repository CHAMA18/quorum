<!doctype html>
<html
  lang="en"
  data-resolution="custom"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Ground","default":"#0c0d10"},
    {"id":"color-accent","type":"color","label":"Audit red","default":"#e8382a"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0c0d10;
        --accent: #e8382a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ground);
      }
      .scene-host {
        position: absolute;
        inset: 0;
      }
      #wipe {
        position: absolute;
        top: -2%;
        bottom: -2%;
        left: 0;
        right: auto;
        width: 2px;
        height: auto;
        z-index: 20;
        pointer-events: none;
        background: var(--accent);
        box-shadow:
          0 0 18px rgba(232, 56, 42, 0.85),
          0 0 70px rgba(232, 56, 42, 0.4);
      }
      #flash {
        position: absolute;
        inset: 0;
        z-index: 21;
        background: #f3d0ae;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="1080"
      data-height="1350"
      data-motion-blur="on"
    >
      <div
        id="city-host"
        class="scene-host clip"
        data-composition-id="city"
        data-composition-src="compositions/city.html"
        data-start="0"
        data-duration="4.35"
        data-track-index="1"
        data-width="1080"
        data-height="1350"
        data-track-kind="graphics"
      ></div>
      <div
        id="press-host"
        class="scene-host clip"
        data-composition-id="press"
        data-composition-src="compositions/press.html"
        data-start="3.85"
        data-duration="3.15"
        data-track-index="2"
        data-width="1080"
        data-height="1350"
        data-track-kind="graphics"
      ></div>
      <div
        id="sign-host"
        class="scene-host clip"
        data-composition-id="sign"
        data-composition-src="compositions/sign.html"
        data-start="7"
        data-duration="4"
        data-track-index="3"
        data-width="1080"
        data-height="1350"
        data-track-kind="graphics"
      ></div>
      <div
        id="seal-host"
        class="scene-host clip"
        data-composition-id="seal"
        data-composition-src="compositions/seal.html"
        data-start="10.9"
        data-duration="1.1"
        data-track-index="4"
        data-width="1080"
        data-height="1350"
        data-track-kind="graphics"
      ></div>

      <div id="wipe" class="clip" data-start="3.85" data-duration="0.45" data-track-index="10"></div>
      <div id="flash" class="clip" data-start="6.98" data-duration="0.18" data-track-index="11"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      /* The audit scan: a red edge crosses the frame as the file enters. */
      tl.fromTo(
        "#wipe",
        { x: 1080, opacity: 1 },
        { x: 0, duration: 0.38, ease: "power2.inOut" },
        3.85
      );
      tl.to("#wipe", { opacity: 0, duration: 0.08, ease: "power1.out" }, 4.23);

      /* A two-frame shutter as the paper becomes the signature. */
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.16, duration: 0.04, ease: "power1.out" }, 6.98);
      tl.to("#flash", { opacity: 0, duration: 0.12, ease: "power1.in" }, 7.02);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
