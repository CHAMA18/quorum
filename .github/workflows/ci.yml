name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (web app)
        run: bun run lint

      - name: Test (agent engine — safety rules enforced by tests)
        working-directory: mini-services/quorum-mcp
        run: bun test

      - name: Evaluation harness (regression + mutation detection)
        working-directory: mini-services/quorum-mcp
        run: bun eval.ts --runs 3
