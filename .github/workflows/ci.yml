name: CI

on:
  push:
    branches: [main, mirror-integration]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (web app)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test (full suite)
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Audit (blocking on critical)
        run: bun run audit:critical

      - name: Audit (report high and below)
        run: bun audit --production || true

      - name: Container build
        run: docker build -t quorum:ci .

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: node_modules/.bin/playwright install --with-deps chromium

      - name: Browser smoke tests
        run: bun run test:e2e
