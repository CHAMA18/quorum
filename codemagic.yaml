workflows:
  quorum_macos:
    name: Quorum for macOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: lts
      groups:
        - github_credentials
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: Install dependencies
        script: npm install --no-audit --no-fund
      - name: Install isolated desktop dependencies
        script: npm install --prefix desktop --include=dev --no-audit --no-fund
      - name: Generate application icons
        script: npm run desktop:icons
      - name: Package macOS app
        script: npx electron-builder --mac dmg zip --universal --publish never
    artifacts:
      - release/*.dmg
      - release/*.zip
    publishing:
      scripts:
        - name: Publish tagged build to GitHub Releases
          script: node scripts/publish-github-release.mjs

  quorum_windows:
    name: Quorum for Windows
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: lts
      groups:
        - github_credentials
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: Install dependencies
        script: npm install --no-audit --no-fund
      - name: Install isolated desktop dependencies
        script: npm install --prefix desktop --include=dev --no-audit --no-fund
      - name: Generate application icons
        script: npm run desktop:icons
      - name: Package Windows portable app
        script: npx electron-builder --win zip --x64 --publish never
    artifacts:
      - release/*.zip
    publishing:
      scripts:
        - name: Publish tagged build to GitHub Releases
          script: node scripts/publish-github-release.mjs
