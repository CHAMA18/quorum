<template><style>#root{width:100%;height:100%;position:relative;pointer-events:none}.caption{position:absolute;left:192px;right:192px;top:920px;text-align:center;font:400 36px/1.25 Montserrat,sans-serif;color:#f5f2ed}.caption span{display:inline-block;background:#121318;padding:7px 22px;border-radius:4px}</style><div id="root" data-composition-id="captions" data-duration="230" data-width="1920" data-height="1080"><div id="cap-0" class="clip caption" data-start="0.000" data-duration="5.025" data-track-index="0"><span>Over 450 million US dollars is lost every year due to faulty</span></div><div id="cap-1" class="clip caption" data-start="5.060" data-duration="5.210" data-track-index="0"><span>procurement means. Through Quorum, we seek to address this challenge.</span></div><div id="cap-2" class="clip caption" data-start="10.520" data-duration="1.290" data-track-index="0"><span>Let me show you how it works.</span></div><div id="cap-3" class="clip caption" data-start="12.000" data-duration="2.350" data-track-index="0"><span>We start on the supplier side.</span></div><div id="cap-4" class="clip caption" data-start="14.960" data-duration="4.265" data-track-index="0"><span>The portal keeps the required documents together, so it&#x27;s clear what needs</span></div><div id="cap-5" class="clip caption" data-start="19.260" data-duration="1.150" data-track-index="0"><span>to be submitted.</span></div><div id="cap-6" class="clip caption" data-start="21.280" data-duration="3.925" data-track-index="0"><span>Here I&#x27;m opening a tax registration certificate and running the AI document</span></div><div id="cap-7" class="clip caption" data-start="25.240" data-duration="5.065" data-track-index="0"><span>check. Our Meta-powered tool reads the document and checks it against</span></div><div id="cap-8" class="clip caption" data-start="30.340" data-duration="1.550" data-track-index="0"><span>the requested requirement.</span></div><div id="cap-9" class="clip caption" data-start="33.020" data-duration="3.885" data-track-index="0"><span>The findings appear beside the original file, making the details easy</span></div><div id="cap-10" class="clip caption" data-start="36.940" data-duration="4.510" data-track-index="0"><span>to compare. That gives the reviewer a useful starting point.</span></div><div id="cap-11" class="clip caption" data-start="42.180" data-duration="2.650" data-track-index="0"><span>It doesn&#x27;t decide whether the supplier qualifies.</span></div><div id="cap-12" class="clip caption" data-start="45.000" data-duration="3.290" data-track-index="0"><span>Now, let&#x27;s move into the officer&#x27;s workspace.</span></div><div id="cap-13" class="clip caption" data-start="48.700" data-duration="3.685" data-track-index="0"><span>This is the same procurement process from the notice and mandatory</span></div><div id="cap-14" class="clip caption" data-start="52.420" data-duration="2.610" data-track-index="0"><span>requirements through to bid opening and evaluation.</span></div><div id="cap-15" class="clip caption" data-start="55.800" data-duration="2.570" data-track-index="0"><span>The criteria are set before the bids are assessed.</span></div><div id="cap-16" class="clip caption" data-start="59.020" data-duration="6.745" data-track-index="0"><span>In this example, technical capability carries 60% and delivery carries 40%.</span></div><div id="cap-17" class="clip caption" data-start="65.800" data-duration="2.770" data-track-index="0"><span>Officers can check the scores alongside the evidence.</span></div><div id="cap-18" class="clip caption" data-start="69.060" data-duration="3.525" data-track-index="0"><span>Everything stays in one tender file, so the next person can follow</span></div><div id="cap-19" class="clip caption" data-start="72.620" data-duration="3.385" data-track-index="0"><span>the reasoning without having to piece it together from separate spreadsheets</span></div><div id="cap-20" class="clip caption" data-start="76.040" data-duration="0.830" data-track-index="0"><span>and messages.</span></div><div id="cap-21" class="clip caption" data-start="77.000" data-duration="3.530" data-track-index="0"><span>Next, we run the AI assisted bid review.</span></div><div id="cap-22" class="clip caption" data-start="81.460" data-duration="4.085" data-track-index="0"><span>We include every admitted bidder, confirm consent, and review their</span></div><div id="cap-23" class="clip caption" data-start="85.580" data-duration="2.050" data-track-index="0"><span>submissions against the issued criteria.</span></div><div id="cap-24" class="clip caption" data-start="88.720" data-duration="1.570" data-track-index="0"><span>The review is read only.</span></div><div id="cap-25" class="clip caption" data-start="90.940" data-duration="3.350" data-track-index="0"><span>Here you can see both bidders compared against the same requirements.</span></div><div id="cap-26" class="clip caption" data-start="95.300" data-duration="2.985" data-track-index="0"><span>When the documents don&#x27;t establish a required reference contract</span></div><div id="cap-27" class="clip caption" data-start="98.320" data-duration="4.330" data-track-index="0"><span>or a committed delivery plan, the result says not evidenced.</span></div><div id="cap-28" class="clip caption" data-start="103.160" data-duration="1.930" data-track-index="0"><span>It doesn&#x27;t fill in the gap.</span></div><div id="cap-29" class="clip caption" data-start="105.940" data-duration="3.610" data-track-index="0"><span>Instead, it gives the committee specific questions to follow up.</span></div><div id="cap-30" class="clip caption" data-start="110.060" data-duration="1.630" data-track-index="0"><span>Can we verify these references?</span></div><div id="cap-31" class="clip caption" data-start="112.200" data-duration="1.830" data-track-index="0"><span>Are the delivery milestones clear?</span></div><div id="cap-32" class="clip caption" data-start="114.920" data-duration="2.570" data-track-index="0"><span>Does the price build up support the proposal?</span></div><div id="cap-33" class="clip caption" data-start="118.280" data-duration="1.750" data-track-index="0"><span>That is where the AI helps.</span></div><div id="cap-34" class="clip caption" data-start="120.880" data-duration="3.125" data-track-index="0"><span>It prepares a clearer review so people can spend their time checking</span></div><div id="cap-35" class="clip caption" data-start="124.040" data-duration="0.830" data-track-index="0"><span>what matters.</span></div><div id="cap-36" class="clip caption" data-start="125.864" data-duration="6.246" data-track-index="0"><span>The AI presents the strongest documented fit for the committee consideration.</span></div><div id="cap-37" class="clip caption" data-start="133.660" data-duration="2.210" data-track-index="0"><span>It then evaluates both sides.</span></div><div id="cap-38" class="clip caption" data-start="136.480" data-duration="1.950" data-track-index="0"><span>It then submits information to the committee.</span></div><div id="cap-39" class="clip caption" data-start="139.180" data-duration="3.485" data-track-index="0"><span>Based off of information that it will give you as a committee,</span></div><div id="cap-40" class="clip caption" data-start="142.700" data-duration="1.730" data-track-index="0"><span>you then proceed to then select.</span></div><div id="cap-41" class="clip caption" data-start="145.550" data-duration="5.435" data-track-index="0"><span>So as a committee, you have the ability to set up what</span></div><div id="cap-42" class="clip caption" data-start="151.020" data-duration="5.145" data-track-index="0"><span>we call the full committee that has to make up their own</span></div><div id="cap-43" class="clip caption" data-start="156.200" data-duration="3.410" data-track-index="0"><span>decision. This is a panel of the committee.</span></div><div id="cap-44" class="clip caption" data-start="160.100" data-duration="4.265" data-track-index="0"><span>We can add any other person to the committee to constitute</span></div><div id="cap-45" class="clip caption" data-start="164.400" data-duration="4.705" data-track-index="0"><span>the quorum, who then makes the final decision in terms of who</span></div><div id="cap-46" class="clip caption" data-start="169.140" data-duration="1.610" data-track-index="0"><span>to award a particular contract.</span></div><div id="cap-47" class="clip caption" data-start="171.500" data-duration="2.930" data-track-index="0"><span>Each person has to have the verdict signed.</span></div><div id="cap-48" class="clip caption" data-start="175.000" data-duration="3.045" data-track-index="0"><span>The evaluation record stays visible too.</span></div><div id="cap-49" class="clip caption" data-start="178.080" data-duration="4.310" data-track-index="0"><span>Officers can inspect the evaluator sheets, differences in scores,</span></div><div id="cap-50" class="clip caption" data-start="183.060" data-duration="1.410" data-track-index="0"><span>and the recorded consensus.</span></div><div id="cap-51" class="clip caption" data-start="185.000" data-duration="3.150" data-track-index="0"><span>The AI doesn&#x27;t write those scores or award the tender.</span></div><div id="cap-52" class="clip caption" data-start="188.700" data-duration="3.125" data-track-index="0"><span>The committee records its assessment and authorised people make</span></div><div id="cap-53" class="clip caption" data-start="191.860" data-duration="3.885" data-track-index="0"><span>the decision. Award, contract and complaint records remain connected</span></div><div id="cap-54" class="clip caption" data-start="195.780" data-duration="1.150" data-track-index="0"><span>to the same file.</span></div><div id="cap-55" class="clip caption" data-start="197.500" data-duration="3.065" data-track-index="0"><span>So the team can explain both what it decided and the evidence</span></div><div id="cap-56" class="clip caption" data-start="200.600" data-duration="1.270" data-track-index="0"><span>behind that decision.</span></div><div id="cap-57" class="clip caption" data-start="202.000" data-duration="4.270" data-track-index="0"><span>We&#x27;ve also published Quorum&#x27;s MCP integration.</span></div><div id="cap-58" class="clip caption" data-start="207.280" data-duration="4.445" data-track-index="0"><span>It lets compatible AI clients connect to our read-only tools, bringing</span></div><div id="cap-59" class="clip caption" data-start="211.760" data-duration="3.070" data-track-index="0"><span>this evidence into the tools teams already use.</span></div><div id="cap-60" class="clip caption" data-start="215.780" data-duration="1.910" data-track-index="0"><span>The boundaries stay the same.</span></div><div id="cap-61" class="clip caption" data-start="218.440" data-duration="4.190" data-track-index="0"><span>The AI helps prepare the work and authorized people keep control.</span></div><div id="cap-62" class="clip caption" data-start="223.800" data-duration="2.470" data-track-index="0"><span>That&#x27;s Quorum. The agent prepares the file.</span></div><div id="cap-63" class="clip caption" data-start="227.140" data-duration="2.030" data-track-index="0"><span>The committee awards the tender.</span></div></div><script>const tl=gsap.timeline({paused:true});window.__timelines["captions"]=tl;</script></template>
