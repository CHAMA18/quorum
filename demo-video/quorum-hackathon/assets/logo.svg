    <rect x="8" y="44" width="12" height="12" rx="3" fill="#ffffff"/>
    <rect x="26" y="8" width="12" height="12" rx="3" fill="none" stroke="#ffffff" stroke-opacity="0.26" stroke-width="1.6"/>
    <rect x="26" y="26" width="12" height="12" rx="3" fill="#e8382a"/>
    <rect x="26" y="44" width="12" height="12" rx="3" fill="none" stroke="#ffffff" stroke-opacity="0.26" stroke-width="1.6"/>
    <rect x="44" y="8" width="12" height="12" rx="3" fill="#ffffff"/>
    <rect x="44" y="26" width="12" height="12" rx="3" fill="none" stroke="#ffffff" stroke-opacity="0.26" stroke-width="1.6"/>
