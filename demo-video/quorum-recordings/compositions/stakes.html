<template><style>#stakes{width:100%;height:100%;position:relative;overflow:hidden;background:#101217}</style><div data-hf-id="hf-fyu7" id="stakes" data-composition-id="stakes" data-duration="20" data-width="1920" data-height="1080"><div data-hf-id="hf-4y7z" class="header"><strong data-hf-id="hf-ujc3">QUORUM<span data-hf-id="hf-kyuz" class="accent">.</span></strong><span data-hf-id="hf-1pgk">01 / 07 · STAKES</span></div><div data-hf-id="hf-tbg2" data-hold="Narrated evidence inspection" class="content"><div data-hf-id="hf-0rj4" style="width:1080px"><p data-hf-id="hf-kj6p" class="eyebrow">THE PUBLIC CONSEQUENCE</p><h1 data-hf-id="hf-cy0q" style="margin-top:28px">A hospital cannot use a waiting tender.</h1><p data-hf-id="hf-3n84" class="body" style="margin-top:35px;width:980px">Procurement review connects public money to essential services.</p></div><div data-hf-id="hf-fcem" style="position:absolute;right:20px;top:62px;width:500px"><p data-hf-id="hf-wgdo" class="stat accent">17%</p><p data-hf-id="hf-fyij" class="body" style="margin-top:20px">of GDP on average</p><p data-hf-id="hf-jb9e" class="small">Public procurement across Africa</p></div><div data-hf-id="hf-1fza" class="panel" style="margin-top:58px;width:1728px"><p data-hf-id="hf-mudh" class="eyebrow">STARTING IN ZAMBIA</p><p data-hf-id="hf-usob" class="body" style="margin-top:12px">One procurement officer. A complete file. A committee that can inspect the evidence.</p></div></div><div data-hf-id="hf-lo92" class="foot">Source: World Bank, 2023 · procurement averages 17% of GDP across Africa · source notes in the submission</div></div><script>const tl=gsap.timeline({paused:true});tl.fromTo('#stakes .content',{opacity:1,y:18},{opacity:1,y:0,duration:.6,ease:'power3.out'},.05);window.__timelines['stakes']=tl;</script></template>
